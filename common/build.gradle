// Loader-agnostic code. Compiled against vanilla Minecraft only, so any Fabric or
// NeoForge import here fails the build. Minecraft 26.x ships unobfuscated, so the
// same compiled classes work on both loaders.
plugins {
	id 'net.fabricmc.fabric-loom'
}

loom {
	splitEnvironmentSourceSets()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Only for Mixin annotations / MixinExtras; no net.fabricmc imports in common.
	compileOnly "net.fabricmc:fabric-loader:${project.loader_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

// common is not shipped on its own; the loader modules package its classes.
tasks.named('jar') { archiveClassifier = 'dev' }
